<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>照片排版工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1 data-i18n="appTitle">照片排版</h1>
        <p data-i18n="appSubtitle">按真实照片尺寸裁切、排版并导出打印图。</p>
      </div>

      <label class="upload">
        <input id="fileInput" type="file" accept="image/*" multiple>
        <span data-i18n="addPhotos">添加照片</span>
      </label>

      <section class="panel">
        <h2 data-i18n="paper">纸张</h2>
        <label>
          <span data-i18n="paperSize">纸张尺寸</span>
          <select id="paperSelect">
            <option value="A2">A2 420x594mm</option>
            <option value="A3">A3 297x420mm</option>
            <option value="A4" selected>A4 210x297mm</option>
            <option value="A5">A5 148x210mm</option>
          </select>
        </label>
        <button id="rotatePageButton" type="button" data-i18n="rotatePage">旋转画布</button>
        <label>
          <span data-i18n="exportDpi">导出 DPI</span>
          <select id="dpiSelect">
            <option value="300" selected>300 DPI</option>
            <option value="600">600 DPI</option>
            <option value="800">800 DPI</option>
            <option value="1000">1000 DPI</option>
            <option value="1200">1200 DPI</option>
          </select>
        </label>
        <label>
          <span data-i18n="pageMargin">裁切边距(mm)</span>
          <input id="pageMargin" type="number" min="0" max="30" step="0.5" value="5">
        </label>
        <label>
          <span data-i18n="photoGap">照片间距(mm)</span>
          <input id="photoGap" type="number" min="0" max="20" step="0.5" value="3">
        </label>
        <label>
          <span data-i18n="bleed">出血(mm)</span>
          <input id="bleed" type="number" min="0" max="5" step="0.5" value="1">
        </label>
      </section>

      <section class="panel">
        <h2 data-i18n="currentPhoto">当前照片</h2>
        <label>
          <span data-i18n="printSize">打印尺寸</span>
          <select id="sizeSelect">
            <option value="4R">4 寸 4R 102x152mm</option>
            <option value="5R">5 寸 5R 127x178mm</option>
            <option value="6R">6 寸 6R 152x203mm</option>
            <option value="7R">7 寸 7R 178x254mm</option>
            <option value="8R">8 寸 8R 203x254mm</option>
          </select>
        </label>
        <div class="button-row">
          <button id="rotatePhotoButton" type="button" data-i18n="rotatePhoto">旋转照片</button>
          <button id="rotateButton" type="button" data-i18n="rotateSize">旋转尺寸</button>
        </div>
        <div class="button-row">
          <button id="fitButton" type="button" data-i18n="fitFill">适配填满</button>
          <button id="removeButton" class="danger-button" type="button" data-i18n="removePhoto">移除照片</button>
        </div>
        <div class="button-row">
          <button id="moveFrameButton" type="button" data-i18n="moveFrameMode">移动照片框</button>
          <button id="lockButton" type="button" data-i18n="lockPhoto">锁定照片</button>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="layout">排版</h2>
        <button id="autoLayoutButton" type="button" data-i18n="autoLayout">智能排版</button>
        <button id="addPageButton" type="button" data-i18n="addPage">新增画布</button>
        <button id="exportButton" type="button" data-i18n="exportCurrent">导出当前画布 PNG</button>
        <button id="exportAllButton" type="button" data-i18n="exportAll">导出全部画布 PNG</button>
      </section>

      <section class="hint">
        <p data-i18n="hint">左键或单指拖动照片内图像选取区域，滚轮或双指缩放。右键或长按照片可打开快捷菜单。</p>
      </section>
    </aside>

    <section class="workspace">
      <div class="topbar">
        <div id="pageTabs" class="tabs"></div>
        <div class="topbar-right">
          <label class="debug-toggle">
            <input id="debugToggle" type="checkbox">
            <span data-i18n="debugToggle">调试</span>
          </label>
          <a class="icon-link" href="https://github.com/OrangeCrazy/OrangeCrazy.github.io" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库 / 提交 Issue" title="GitHub 仓库 / 提交 Issue" data-i18n-aria="repoLink" data-i18n-title="repoLink">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.33 9.33 0 0 1 12 6.95c.85 0 1.7.12 2.5.35 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.49A10.08 10.08 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"></path>
            </svg>
          </a>
          <label class="language-field">
            <span data-i18n="language">语言</span>
            <select id="languageSelect">
              <option value="zh-CN">简体中文</option>
              <option value="zh-HK">繁體中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <div id="status" class="status">尚未添加照片</div>
        </div>
      </div>
      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="previewCanvas" width="794" height="1123"></canvas>
      </div>
      <details id="debugPanel" class="floating-debug" hidden>
        <summary data-i18n="debugPanel">调试信息</summary>
        <div id="debugLog" class="debug-log"></div>
      </details>
      <div class="zoom-controls" aria-label="画布缩放控制" data-i18n-aria="zoomControls">
        <button id="zoomOutButton" type="button" title="缩小画布" data-i18n-title="zoomOut">-</button>
        <label>
          <span data-i18n="zoom">缩放</span>
          <input id="zoomInput" type="number" min="10" max="300" step="5" value="100">
        </label>
        <span>%</span>
        <button id="zoomInButton" type="button" title="放大画布" data-i18n-title="zoomIn">+</button>
        <button id="zoomAutoButton" type="button" data-i18n="autoZoom">自适应</button>
      </div>
    </section>
  </main>

  <div id="contextMenu" class="context-menu" hidden></div>

  <script src="app.js"></script>
</body>
</html>
